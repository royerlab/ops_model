<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- OPSin: eye (optical) whose iris is a cell with organelles (phenotype) -->
  <!-- eye almond -->
  <path d="M5 32 Q32 7 59 32 Q32 57 5 32 Z" fill="#0d0f13" stroke="#26c6ff" stroke-width="3" stroke-linejoin="round"/>
  <!-- iris = cell -->
  <circle cx="32" cy="32" r="14.5" fill="#0d0f13" stroke="#26c6ff" stroke-width="2.5"/>
  <!-- nucleus -->
  <circle cx="29" cy="30" r="6.2" fill="#bc8cff"/>
  <!-- mitochondrion (worm) -->
  <path d="M33 35 q4 -4 7 0 q3 3 6 -1" fill="none" stroke="#f0a020" stroke-width="2.4" stroke-linecap="round"/>
  <!-- lysosome / small organelles -->
  <circle cx="35" cy="27" r="1.7" fill="#3fb950"/>
  <circle cx="26" cy="37" r="1.5" fill="#3fb950"/>
  <!-- catchlight -->
  <circle cx="25.5" cy="25.5" r="2.1" fill="#ffffff"/>
</svg>
