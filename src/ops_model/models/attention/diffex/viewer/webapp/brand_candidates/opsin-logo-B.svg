<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- OPSin variant B: eye outline, pupil is a cell, a protein helix arcs around it -->
  <!-- eye almond -->
  <path d="M5 32 Q32 8 59 32 Q32 56 5 32 Z" fill="none" stroke="#26c6ff" stroke-width="3" stroke-linejoin="round"/>
  <!-- cell pupil -->
  <circle cx="32" cy="32" r="11" fill="#0d0f13" stroke="#26c6ff" stroke-width="2"/>
  <circle cx="30" cy="31" r="4.6" fill="#bc8cff"/>
  <circle cx="35" cy="34" r="1.7" fill="#f0a020"/>
  <circle cx="34" cy="28" r="1.4" fill="#3fb950"/>
  <!-- protein helix ribbon arcing across the iris -->
  <path d="M14 32 q6 -9 12 0 q6 9 12 0 q6 -9 12 0" fill="none" stroke="#f0a020" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>
  <circle cx="25.5" cy="26" r="1.8" fill="#ffffff"/>
</svg>
